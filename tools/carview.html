<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RB20 model views</title>
<style>html,body{margin:0;height:100%;background:#cfd6de;overflow:hidden}canvas{display:block}#lbl{position:fixed;left:8px;top:6px;font:13px system-ui;color:#123}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.min.js","three/addons/":"../vendor/three/addons/"}}</script>
</head>
<body>
<div id="lbl"></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';
import { createCar } from '../js/carmodel.js';
import { outdoorEnv, tunnelEnv } from '../js/envmap.js';
import { SPEC, Z, CAMERA_MOUNTS, buildCollisionPoints } from '../js/carspec.js';
import { LIGHT, setupRenderer } from '../js/lighting.js';
const P = new URLSearchParams(location.search);
const view = P.get('view') || 'side';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
// colour pipeline and light balance shared with the game (js/lighting.js); URL overrides for A/B
for (const k of ['sun', 'hemi', 'env', 'exposure']) if (P.get(k)) LIGHT[k] = +P.get(k);
setupRenderer(renderer, { toneMapping: P.get('tm') || 'neutral-notoe' });
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfd6de);
// lighting as in the game (env=outdoor, default) or the tunnel (env=tunnel); env=room: studio
const envMode = P.get('env') || 'outdoor';
const sunDirV = new THREE.Vector3(...(P.get('sundir') || '4,8,-3').split(',').map(Number)).normalize();
if (envMode === 'room') {
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.add(new THREE.HemisphereLight(0xdde8ff, 0x445566, 0.6));
} else if (envMode === 'tunnel') {
  scene.environment = tunnelEnv(renderer); scene.environmentIntensity = LIGHT.env * 0.6;
  scene.add(new THREE.HemisphereLight(0xffe2bd, 0x3a3733, 0.85 * 0.70));
  scene.background = new THREE.Color(0x2a2724);
} else {
  scene.environment = outdoorEnv(renderer, sunDirV); scene.environmentIntensity = LIGHT.env;
  scene.add(new THREE.HemisphereLight(LIGHT.sky, LIGHT.ground, LIGHT.hemi));
}
const sun = new THREE.DirectionalLight(LIGHT.sunColor, envMode === 'tunnel' ? LIGHT.sun * 0.03 : LIGHT.sun);
sun.position.copy(sunDirV).multiplyScalar(10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 });
scene.add(sun);
const car = createCar({ quality: 'high' });
scene.add(car.root);
const steer = +(P.get('steer') || 0) * Math.PI / 180;
const dash = { dt: 0.1, time: 0, rpm: +(P.get('rpm') || 11200), kmh: +(P.get('kmh') || 238), gear: P.get('gear') || '6', ers: 0.74, bias: 0.57, lock: false, limiter: false };
car.update({ steer, steeringWheel: steer * 4.4, dash });
// ground + 0.1 m grid
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x9aa1a8, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
if (P.get('grid') !== '0') {
  const g1 = new THREE.GridHelper(10, 100, 0x6a7380, 0x8a939e); g1.position.y = 0.001; scene.add(g1);
}
if (P.get('hits') === '1') {
  for (const c of buildCollisionPoints()) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(c.r, c.r, 0.02, 16), new THREE.MeshBasicMaterial({ color: c.kind === 'tyre' ? 0x00aa00 : 0xff00ff }));
    m.position.set(c.x, 0.02, c.z); scene.add(m);
  }
}
let cam;
const ortho = (w) => { const h = w * H / W; return new THREE.OrthographicCamera(-w / 2, w / 2, h / 2, -h / 2, 0.01, 100); };
const cz = (Z.fwLE + Z.rwTE) / 2;
if (view === 'side') { cam = ortho(6.2); cam.position.set(20, 0.5, cz); cam.lookAt(0, 0.5, cz); }
else if (view === 'sideL') { cam = ortho(6.2); cam.position.set(-20, 0.5, cz); cam.lookAt(0, 0.5, cz); }
else if (view === 'front') { cam = ortho(2.6); cam.position.set(0, 0.5, -20); cam.lookAt(0, 0.5, 0); }
else if (view === 'rear') { cam = ortho(2.6); cam.position.set(0, 0.5, 20); cam.lookAt(0, 0.5, 0); }
else if (view === 'top') { cam = ortho(6.2); cam.position.set(0, 20, cz); cam.up.set(1, 0, 0); cam.lookAt(0, 0, cz); }
else if (view === 'rear34') { cam = new THREE.PerspectiveCamera(30, W / H, 0.05, 100); cam.position.set(4.2, 1.9, Z.RA + 5.0); cam.lookAt(0, 0.45, 0); }
else if (view === 'front34') { cam = new THREE.PerspectiveCamera(30, W / H, 0.05, 100); cam.position.set(-4.0, 1.6, Z.FA - 5.0); cam.lookAt(0, 0.4, -0.3); }
else if (view === 'halo34') { cam = new THREE.PerspectiveCamera(26, W / H, 0.05, 100); cam.position.set(-1.55, 1.45, Z.FA + 0.94 - 1.75); cam.lookAt(0, 0.70, Z.FA + 1.28); }
else if (view === 'haloside') { cam = new THREE.PerspectiveCamera(24, W / H, 0.05, 100); cam.position.set(2.6, 1.05, Z.FA + 1.25); cam.lookAt(0, 0.70, Z.FA + 1.28); }
else if (view === 'halorear') { cam = new THREE.PerspectiveCamera(30, W / H, 0.05, 100); cam.position.set(1.1, 1.55, Z.FA + 2.9); cam.lookAt(0, 0.74, Z.FA + 1.2); }
else if (view === 'halofront') { cam = new THREE.PerspectiveCamera(16, W / H, 0.05, 100); cam.position.set(0.35, 1.05, Z.FA + 0.05); cam.lookAt(0, 0.74, Z.FA + 0.95); }
else if (view === 'helmet') { cam = new THREE.PerspectiveCamera(18, W / H, 0.05, 100); cam.position.set(-0.95, 1.05, Z.FA + 0.95); cam.lookAt(0, 0.70, Z.FA + 1.56); }
else if (view === 'helmetrear') { cam = new THREE.PerspectiveCamera(18, W / H, 0.05, 100); cam.position.set(0.85, 1.15, Z.FA + 2.45); cam.lookAt(0, 0.70, Z.FA + 1.56); }
else if (view === 'halotop') { cam = new THREE.OrthographicCamera(-0.62 * W / H, 0.62 * W / H, 0.62, -0.62, 0.01, 100); cam.position.set(0, 20, Z.FA + 1.35); cam.up.set(1, 0, 0); cam.lookAt(0, 0, Z.FA + 1.35); }
else if (view === 'halofrontortho') { cam = new THREE.OrthographicCamera(-0.62 * W / H, 0.62 * W / H, 0.62 + 0.55, -0.62 + 0.55, 0.01, 100); cam.position.set(0, 0, -20); cam.lookAt(0, 0, 0); }
else if (view === 'pillarback') { cam = new THREE.PerspectiveCamera(14, W / H, 0.02, 100); cam.position.set(0.05, 0.70, Z.FA + 1.55); cam.lookAt(0, 0.76, Z.FA + 0.94); }
else if (view === 'persp') {
  // generic telephoto view to match reference photos: az 0 = from the car's left (-x),
  // 90 = from the front (-z), 180 = from the right; el = elevation; w = frame width at the target
  const az = +(P.get('az') || 0) * Math.PI / 180, el = +(P.get('el') || 10) * Math.PI / 180, D = +(P.get('D') || 60), w = +(P.get('w') || 6.2);
  const tx = +(P.get('tx') || 0), ty = +(P.get('ty') || 0.45), tz = P.get('tzFA') ? Z.FA + +P.get('tzFA') : +(P.get('tz') || cz);
  const fov = 2 * Math.atan((w / 2) * (H / W) / D) * 180 / Math.PI;
  cam = new THREE.PerspectiveCamera(fov, W / H, 0.5, 500);
  cam.position.set(tx - D * Math.cos(el) * Math.cos(az), ty + D * Math.sin(el), tz - D * Math.cos(el) * Math.sin(az));
  cam.lookAt(tx, ty, tz);
  window.__proj = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
}
else if (view === 'wheelfront' || view === 'wheelside' || view === 'wheeltop') {
  // close-ups of the steering wheel and gloves (camera placed in the wheel's own frame)
  const drv = car.root.getObjectByName('driver'); if (drv) drv.visible = false;
  car.root.updateMatrixWorld(true);
  const SW = car.root.getObjectByName('steeringWheel');
  const at = new THREE.Vector3(0, 0, 0).applyMatrix4(SW.matrixWorld);
  const off = view === 'wheelfront' ? new THREE.Vector3(0.0, 0.05, 0.42) : view === 'wheelside' ? new THREE.Vector3(0.42, 0.05, 0.12) : new THREE.Vector3(0.12, 0.40, 0.18);
  const from = off.applyMatrix4(SW.matrixWorld);
  cam = new THREE.PerspectiveCamera(36, W / H, 0.01, 100); cam.position.copy(from); cam.lookAt(at);
}
else if (view === 'tcam' || view === 'cockpit') {
  const m = CAMERA_MOUNTS[view];
  const hfov = +(P.get('hfov') || 0);
  let vfov = +(P.get('vfov') || m.vfov16x9);
  if (hfov) vfov = 2 * Math.atan(Math.tan(hfov * Math.PI / 360) * H / W) * 180 / Math.PI;
  cam = new THREE.PerspectiveCamera(vfov, W / H, 0.03, 500);
  cam.position.set(m.x, +(P.get('h') || m.y), +(P.get('z') || m.z));
  cam.rotation.set((+(P.get('pitch') || m.pitchDeg)) * Math.PI / 180, 0, 0, 'YXZ');
  if (view === 'tcam') car.tcamPod.visible = false;
  if (view === 'cockpit') { const hel = car.root.getObjectByName('helmet'); if (hel) hel.visible = false; }
  // road markings far ahead to judge the horizon
  for (let k = 1; k < 40; k++) { const s = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 2), new THREE.MeshBasicMaterial({ color: 0xffffff })); s.rotation.x = -Math.PI / 2; s.position.set(0, 0.003, -k * 6); scene.add(s); }
  ground.scale.set(30, 30, 1);
}
cam.layers.enable(1);
document.getElementById('lbl').textContent = `RB20 – ${view}` + (steer ? `  steer ${P.get('steer')}°` : '');
renderer.render(scene, cam);
window.__car = car; window.__scene = scene; window.__THREE = THREE; window.__Z = Z;
// body surface height probe: [[x, FA], ...] -> highest hit (excluding the halo / driver / wheel)
window.__probe = (pts, skip = ['halo', 'driver', 'steeringWheel', 'driverArms']) => {
  const rc = new THREE.Raycaster(); const meshes = [];
  car.root.updateMatrixWorld(true);
  car.root.traverse((o) => { if (!o.isMesh || !o.visible) return; let p = o; while (p) { if (skip.includes(p.name)) return; p = p.parent; } if (o.material && o.material.transparent) return; meshes.push(o); });
  return pts.map(([x, fa]) => { rc.set(new THREE.Vector3(x, 3, Z.FA + fa), new THREE.Vector3(0, -1, 0)); const h = rc.intersectObjects(meshes, false)[0]; return h ? [x, fa, +h.point.y.toFixed(3), h.object.name] : [x, fa, null, '']; });
};
// side profile probe: [[FA, y], ...] -> outermost surface x on the right side (ray from +x)
window.__probeSide = (pts, skip = ['halo', 'driver', 'steeringWheel', 'driverArms', 'mirrorL', 'mirrorR']) => {
  const rc = new THREE.Raycaster(); const meshes = [];
  car.root.updateMatrixWorld(true);
  car.root.traverse((o) => { if (!o.isMesh || !o.visible) return; let p = o; while (p) { if (skip.includes(p.name)) return; p = p.parent; } if (o.material && o.material.transparent) return; meshes.push(o); });
  return pts.map(([fa, y]) => { rc.set(new THREE.Vector3(3, y, Z.FA + fa), new THREE.Vector3(-1, 0, 0)); const h = rc.intersectObjects(meshes, false).filter(h => !/corner|tyre|wheel|spin|hub/.test(h.object.parent ? h.object.parent.name : ''))[0]; return h ? [fa, y, +h.point.x.toFixed(3), h.object.name] : [fa, y, null, '']; });
};
window.__ready = true;
</script>
</body>
</html>
